name: build and run tests
on:
  pull_request
jobs:
  build_and_run_tests_action:
    runs-on: ubuntu-latest
    env:
      KARMA_BROWSERS: PhantomJS,Firefox
      PROTRACTOR_BROWSERS: Firefox
      DISPLAY: :99.0
      KARMA_REPORTERS: spec
    name: Build and run action on on NodeJs 10
    steps:
      - name: Checkout code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: 10
      - run: sudo apt update
      - run: sudo apt-get install firefox -y
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - uses: nanasess/setup-chromedriver@20b60ce40e290aad331f1d26c1d699a5408208bd # v1
        with:
          chromedriver-version: '99.0.4844.51'
      - name: Install dependencies
        run: npm install
      - run: npm rebuild node-sass
      - run:  cd sample_project && ../node_modules/.bin/bower install
      - run: cd ..
      - name: Run headless test
        uses: GabrielBB/xvfb-action@86d97bde4a65fe9b290c0b3fb92c2c4ed0e5302d # v1
        with:
         run:  grunt test
